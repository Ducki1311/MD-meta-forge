<!doctype html>
<html lang="de" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Meta Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { display: ['Orbitron', 'sans-serif'], sans: ['Inter', 'system-ui', 'sans-serif'] },
  colors: { void: '#05070f', panel: '#0b1224', neon: '#22d3ee', gold: '#f5c542', violet: '#a855f7' }
}}};
</script>
<style>
  body { background:
    radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,.12), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(168,85,247,.14), transparent 60%),
    linear-gradient(180deg, #05070f, #070b18 60%, #05070f); }
  .glass { background: rgba(13, 22, 45, .55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
           border: 1px solid rgba(34,211,238,.18); box-shadow: 0 0 0 1px rgba(255,255,255,.02) inset, 0 10px 40px -10px rgba(0,0,0,.6); }
  .neon-text { text-shadow: 0 0 12px rgba(34,211,238,.7); }
  .btn { transition: all .15s ease; }
  .btn:hover { box-shadow: 0 0 18px rgba(34,211,238,.45); transform: translateY(-1px); }
  .card-tile { transition: transform .15s ease, box-shadow .15s ease; }
  .card-tile:hover { transform: translateY(-4px) scale(1.04); z-index: 10; }
  .r-UR { box-shadow: 0 0 0 2px #f5c542, 0 0 16px rgba(245,197,66,.55); }
  .r-SR { box-shadow: 0 0 0 2px #cbd5e1, 0 0 12px rgba(203,213,225,.35); }
  .r-R  { box-shadow: 0 0 0 2px #38bdf8; }
  .r-N  { box-shadow: 0 0 0 1px #475569; }
  .badge-UR { background: linear-gradient(135deg,#fde68a,#f59e0b); color:#1a1200; }
  .badge-SR { background: linear-gradient(135deg,#f8fafc,#94a3b8); color:#0f172a; }
  .badge-R  { background: #0ea5e9; color:#03131c; }
  .badge-N  { background: #475569; color:#e2e8f0; }
  .badge-\? { background: #334155; color:#cbd5e1; }
  .pulse-dot { animation: pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(52,211,153,.7)} 70%{box-shadow:0 0 0 8px rgba(52,211,153,0)} 100%{box-shadow:0 0 0 0 rgba(52,211,153,0)} }
  .draw-in { animation: drawIn .35s ease both; }
  @keyframes drawIn { from { opacity:0; transform: translateY(-20px) rotate(-4deg);} to {opacity:1; transform:none;} }
  ::-webkit-scrollbar { width: 8px; height: 8px } ::-webkit-scrollbar-thumb { background:#1e293b; border-radius: 8px }
  .lang-on { background: #22d3ee; color: #05070f; }
  .tree li { position: relative; padding-left: 1.1rem; }
  .tree li::before { content:''; position:absolute; left:.35rem; top:0; bottom:0; border-left:1px dashed #334155; }
  .tree li::after { content:''; position:absolute; left:.35rem; top:.8rem; width:.6rem; border-top:1px dashed #334155; }
</style>
</head>
<body class="h-full text-slate-200 font-sans antialiased">

<!-- ============ HEADER ============ -->
<header class="sticky top-0 z-30 glass border-x-0 border-t-0">
  <div class="max-w-[1500px] mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
    <a href="/" class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-neon to-violet grid place-items-center font-display font-extrabold text-void">M</div>
      <h1 class="font-display text-lg sm:text-xl tracking-widest neon-text">MD&nbsp;META&nbsp;FORGE</h1>
    </a>
    <div id="statusBadge" class="flex items-center gap-2 text-xs px-3 py-1.5 rounded-full bg-slate-900/70 border border-slate-700">
      <span class="w-2 h-2 rounded-full bg-slate-500" id="statusDot"></span>
      <span id="statusText">…</span>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <div class="flex rounded-lg overflow-hidden border border-slate-600 text-xs font-bold" role="group" aria-label="Language">
        <button id="langDe" onclick="setLang('de')" class="px-2.5 py-2">DE</button>
        <button id="langEn" onclick="setLang('en')" class="px-2.5 py-2">EN</button>
      </div>
      <button onclick="openModal('doctorModal')" class="btn px-3 py-2 rounded-lg bg-violet/20 border border-violet/50 text-sm font-semibold">🩺 <span data-i18n="doctor">Deck Doctor</span></button>
      <button onclick="openModal('helpModal')" class="btn px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm">?</button>
    </div>
  </div>
</header>

<main class="max-w-[1500px] mx-auto px-4 py-5 grid grid-cols-1 lg:grid-cols-[300px_1fr] gap-5">

  <!-- ============ TIER LIST ============ -->
  <aside class="glass rounded-2xl p-4 h-fit lg:sticky lg:top-20">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-display text-sm tracking-widest text-neon" data-i18n="tierlist">TIER-LISTE</h2>
      <span id="sampleInfo" class="text-[11px] text-slate-400"></span>
    </div>
    <input id="tierSearch" oninput="renderTierlist()" data-i18n-ph="searchArch" class="w-full mb-3 px-3 py-2 rounded-lg bg-slate-900/80 border border-slate-700 text-sm focus:outline-none focus:border-neon">
    <ul id="tierlist" class="space-y-1.5 max-h-[65vh] overflow-y-auto pr-1"></ul>
    <p class="text-[11px] text-slate-500 mt-3" data-i18n="tierNote"></p>
  </aside>

  <section class="space-y-5 min-w-0">
    <!-- ============ CONTROLS ============ -->
    <div class="glass rounded-2xl p-4">
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 items-end">
        <label class="col-span-2 md:col-span-1 text-xs text-slate-400"><span data-i18n="archetype">Archetyp</span>
          <select id="archSelect" class="mt-1 w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm text-slate-100"></select>
        </label>
        <label class="text-xs text-slate-400"><span data-i18n="maxUR"></span>
          <input id="maxUR" type="number" min="0" step="30" data-i18n-ph="egUR" class="mt-1 w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm">
        </label>
        <label class="text-xs text-slate-400"><span data-i18n="maxSR"></span>
          <input id="maxSR" type="number" min="0" step="30" data-i18n-ph="egSR" class="mt-1 w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm">
        </label>
        <label class="text-xs text-slate-400"><span data-i18n="target"></span>: <b id="targetVal" class="text-neon">85%</b>
          <input id="target" type="range" min="70" max="95" value="85" oninput="targetVal.textContent=this.value+'%'" class="mt-3 w-full accent-cyan-400">
        </label>
        <div class="flex gap-2">
          <select id="handSize" class="px-2 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm" data-i18n-title="handSizeTip">
            <option value="5" data-i18n="hand5"></option><option value="6" data-i18n="hand6"></option>
          </select>
          <button onclick="buildDeck()" class="btn flex-1 px-4 py-2 rounded-lg bg-gradient-to-r from-cyan-500 to-violet font-bold text-void">⚡ <span data-i18n="build"></span></button>
        </div>
      </div>
    </div>

    <div id="sharedBanner" class="hidden glass rounded-2xl p-3 border-gold/50 flex flex-wrap items-center gap-3 text-sm">
      <span>🔗 <b data-i18n="sharedDeck"></b></span>
      <span class="text-slate-400 text-xs" data-i18n="sharedHint"></span>
      <button onclick="pickArch(S.deck.archetype)" class="btn ml-auto px-3 py-1.5 rounded-lg bg-cyan-500/20 border border-neon text-xs font-semibold" data-i18n="buildOwn"></button>
    </div>

    <div id="emptyState" class="glass rounded-2xl p-10 text-center text-slate-400">
      <div class="font-display text-neon text-lg mb-2" data-i18n="emptyTitle"></div>
      <span data-i18n="emptyText"></span>
    </div>

    <div id="deckArea" class="hidden space-y-5">
      <!-- ============ STATS ============ -->
      <div class="grid grid-cols-2 xl:grid-cols-4 gap-3">
        <div class="glass rounded-2xl p-4"><div class="text-xs text-slate-400" data-i18n="comboOdds"></div><div id="pCombo" class="font-display text-3xl mt-1"></div><div class="text-[11px] text-slate-500" data-i18n="comboDef"></div></div>
        <div class="glass rounded-2xl p-4"><div class="text-xs text-slate-400" data-i18n="oneCard"></div><div id="pOne" class="font-display text-3xl mt-1 text-neon"></div><div id="minStart" class="text-[11px] text-slate-500"></div></div>
        <div class="glass rounded-2xl p-4"><div class="text-xs text-slate-400" data-i18n="interaction"></div><div id="pInter" class="font-display text-3xl mt-1 text-violet"></div><div id="htInfo" class="text-[11px] text-slate-500"></div></div>
        <div class="glass rounded-2xl p-4"><div class="text-xs text-slate-400" data-i18n="craftCost"></div><div id="cpInfo" class="text-sm mt-2 space-y-0.5"></div></div>
      </div>

      <div class="grid grid-cols-1 xl:grid-cols-2 gap-5">
        <div class="glass rounded-2xl p-4">
          <h3 class="font-display text-xs tracking-widest text-neon mb-2" data-i18n="handQuality"></h3>
          <div class="h-56"><canvas id="tierChart"></canvas></div>
        </div>
        <div class="glass rounded-2xl p-4">
          <h3 class="font-display text-xs tracking-widest text-neon mb-2" data-i18n="ratioTitle"></h3>
          <div class="h-56"><canvas id="ratioChart"></canvas></div>
        </div>
      </div>

      <!-- ============ TEST HAND ============ -->
      <div class="glass rounded-2xl p-4">
        <div class="flex flex-wrap items-center gap-3 mb-3">
          <h3 class="font-display text-xs tracking-widest text-neon" data-i18n="testHand"></h3>
          <button onclick="drawHand()" class="btn px-4 py-2 rounded-lg bg-cyan-500/20 border border-neon text-sm font-semibold">🎴 <span id="drawLabel"></span></button>
          <span id="handTier" class="text-sm"></span>
          <span id="drawStats" class="ml-auto text-xs text-slate-400"></span>
        </div>
        <div id="hand" class="flex gap-3 overflow-x-auto pb-1 min-h-[10px]"></div>
      </div>

      <!-- ============ DECK ============ -->
      <div class="glass rounded-2xl p-4">
        <div class="flex flex-wrap items-center gap-2 mb-3">
          <h3 class="font-display text-xs tracking-widest text-neon">MAIN DECK <span id="mainCount" class="text-slate-400"></span></h3>
          <div id="roleCounts" class="flex flex-wrap gap-1.5 text-[11px]"></div>
          <div class="ml-auto flex flex-wrap gap-2">
            <button onclick="openPlaybook()" class="btn px-3 py-1.5 rounded-lg bg-violet/20 border border-violet/50 text-xs font-semibold">📖 <span data-i18n="guide"></span></button>
            <button onclick="openShare()" class="btn px-3 py-1.5 rounded-lg bg-amber-400/20 border border-amber-400/70 text-xs font-semibold">🔗 <span data-i18n="share"></span></button>
            <button onclick="exportYdk()" class="btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-600 text-xs">⬇ .ydk</button>
            <button onclick="copyYdke()" class="btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-600 text-xs">ydke://</button>
            <button onclick="copyText()" class="btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-600 text-xs" data-i18n="textList"></button>
          </div>
        </div>
        <p class="text-[11px] text-slate-500 mb-3" data-i18n="roleTip"></p>
        <div id="mainDeck" class="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 gap-2"></div>
        <h3 class="font-display text-xs tracking-widest text-neon mt-5 mb-3">EXTRA DECK <span id="extraCount" class="text-slate-400"></span></h3>
        <div id="extraDeck" class="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 gap-2"></div>
      </div>

      <div id="changesBox" class="glass rounded-2xl p-4">
        <h3 class="font-display text-xs tracking-widest text-neon mb-2" data-i18n="optLog"></h3>
        <ul id="changes" class="text-sm space-y-1"></ul>
        <div id="sources" class="text-[11px] text-slate-500 mt-3"></div>
      </div>
    </div>
  </section>
</main>

<footer class="max-w-[1500px] mx-auto px-4 pb-8 text-[11px] text-slate-500" data-i18n="footer"></footer>

<div id="tooltip" class="hidden fixed z-50 max-w-sm glass rounded-xl p-3 text-xs pointer-events-none"></div>
<div id="roleMenu" class="hidden fixed z-50 glass rounded-xl p-2 text-sm"></div>

<!-- ============ MODALS ============ -->
<div id="playbookModal" class="hidden fixed inset-0 z-40 bg-black/70 p-4 overflow-y-auto" onclick="if(event.target===this)closeModal('playbookModal')">
  <div class="glass rounded-2xl max-w-3xl mx-auto mt-10 p-5">
    <div class="flex items-center mb-3"><h2 class="font-display tracking-widest text-neon" data-i18n="guideTitle"></h2>
      <button onclick="closeModal('playbookModal')" class="ml-auto text-slate-400 hover:text-white text-xl">✕</button></div>
    <div id="playbookBody" class="space-y-5 text-sm"></div>
  </div>
</div>

<div id="editorModal" class="hidden fixed inset-0 z-50 bg-black/80 p-4 overflow-y-auto" onclick="if(event.target===this)closeModal('editorModal')">
  <div class="glass rounded-2xl max-w-3xl mx-auto mt-10 p-5 space-y-3 text-sm">
    <div class="flex items-center"><h2 class="font-display tracking-widest text-amber-300" data-i18n="editorTitle"></h2>
      <button onclick="closeModal('editorModal')" class="ml-auto text-slate-400 hover:text-white text-xl">✕</button></div>
    <p class="text-xs text-slate-400" data-i18n="editorIntro"></p>
    <label class="block text-xs text-slate-400"><span data-i18n="edSteps"></span>
      <textarea id="edSteps" rows="9" class="mt-1 w-full p-3 rounded-lg bg-slate-950 border border-slate-700 text-sm focus:outline-none focus:border-amber-400"></textarea></label>
    <label class="block text-xs text-slate-400"><span data-i18n="edChokes"></span>
      <textarea id="edChokes" rows="4" class="mt-1 w-full p-3 rounded-lg bg-slate-950 border border-slate-700 text-sm focus:outline-none focus:border-amber-400"></textarea></label>
    <label class="block text-xs text-slate-400"><span data-i18n="edNotes"></span>
      <textarea id="edNotes" rows="2" class="mt-1 w-full p-3 rounded-lg bg-slate-950 border border-slate-700 text-sm focus:outline-none focus:border-amber-400"></textarea></label>
    <div class="flex flex-wrap gap-2">
      <button onclick="saveDraft()" class="btn px-3 py-2 rounded-lg bg-amber-400/20 border border-amber-400 font-semibold" data-i18n="edSave"></button>
      <button onclick="downloadCombos()" class="btn px-3 py-2 rounded-lg bg-cyan-500/20 border border-neon font-semibold" data-i18n="edDownload"></button>
      <button onclick="deleteDraft()" class="btn ml-auto px-3 py-2 rounded-lg bg-slate-800 border border-slate-600" data-i18n="edDelete"></button>
    </div>
    <ol class="text-xs text-slate-400 list-decimal ml-5 space-y-0.5" id="edHowto"></ol>
  </div>
</div>

<div id="shareModal" class="hidden fixed inset-0 z-50 bg-black/80 p-4 overflow-y-auto" onclick="if(event.target===this)closeModal('shareModal')">
  <div class="glass rounded-2xl max-w-2xl mx-auto mt-10 p-5 space-y-3 text-sm">
    <div class="flex items-center"><h2 class="font-display tracking-widest text-amber-300" data-i18n="shareTitle"></h2>
      <button onclick="closeModal('shareModal')" class="ml-auto text-slate-400 hover:text-white text-xl">✕</button></div>
    <div class="relative rounded-xl overflow-hidden border border-slate-700 bg-slate-900 aspect-[1200/630] grid place-items-center">
      <span id="shareImgLoading" class="text-slate-400 text-xs" data-i18n="previewLoading"></span>
      <img id="shareImg" alt="" class="absolute inset-0 w-full h-full object-cover hidden" onload="this.classList.remove('hidden');shareImgLoading.classList.add('hidden')">
    </div>
    <div class="flex gap-2"><input id="shareUrl" readonly class="flex-1 min-w-0 px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-xs font-mono">
      <button onclick="copyShare()" class="btn px-3 py-2 rounded-lg bg-cyan-500/20 border border-neon font-semibold text-xs" data-i18n="copyLink"></button></div>
    <div class="flex flex-wrap gap-2">
      <button id="nativeShare" onclick="nativeShare()" class="hidden btn px-3 py-2 rounded-lg bg-amber-400/20 border border-amber-400 text-xs font-semibold" data-i18n="shareVia"></button>
      <a id="shareReddit" target="_blank" rel="noopener" class="btn px-3 py-2 rounded-lg bg-slate-800 border border-slate-600 text-xs">Reddit</a>
      <a id="shareX" target="_blank" rel="noopener" class="btn px-3 py-2 rounded-lg bg-slate-800 border border-slate-600 text-xs">X / Twitter</a>
      <a id="shareWa" target="_blank" rel="noopener" class="btn px-3 py-2 rounded-lg bg-slate-800 border border-slate-600 text-xs">WhatsApp</a>
      <a id="shareImgDl" download class="btn px-3 py-2 rounded-lg bg-slate-800 border border-slate-600 text-xs" data-i18n="downloadImg"></a>
    </div>
    <p class="text-[11px] text-slate-500" data-i18n="shareNote"></p>
  </div>
</div>

<div id="doctorModal" class="hidden fixed inset-0 z-40 bg-black/70 p-4 overflow-y-auto" onclick="if(event.target===this)closeModal('doctorModal')">
  <div class="glass rounded-2xl max-w-4xl mx-auto mt-10 p-5">
    <div class="flex items-center mb-3"><h2 class="font-display tracking-widest text-violet">DECK DOCTOR</h2>
      <button onclick="closeModal('doctorModal')" class="ml-auto text-slate-400 hover:text-white text-xl">✕</button></div>
    <p class="text-xs text-slate-400 mb-2" data-i18n="doctorIntro"></p>
    <textarea id="doctorText" rows="10" class="w-full p-3 rounded-lg bg-slate-950 border border-slate-700 font-mono text-xs focus:outline-none focus:border-violet" placeholder="#main&#10;14558127&#10;…"></textarea>
    <div class="flex flex-wrap items-center gap-3 mt-3">
      <input type="file" accept=".ydk,.txt" onchange="loadYdkFile(this)" class="text-xs text-slate-400">
      <label class="text-xs flex items-center gap-2"><input id="doctorAi" type="checkbox" class="accent-violet-500"> <span data-i18n="aiAnalysis"></span></label>
      <button onclick="runDoctor()" class="btn ml-auto px-4 py-2 rounded-lg bg-violet/30 border border-violet font-semibold text-sm" data-i18n="analyze"></button>
    </div>
    <div id="doctorResult" class="mt-4 space-y-3 text-sm"></div>
  </div>
</div>

<div id="helpModal" class="hidden fixed inset-0 z-40 bg-black/70 p-4" onclick="if(event.target===this)closeModal('helpModal')">
  <div class="glass rounded-2xl max-w-2xl mx-auto mt-16 p-5 text-sm space-y-2">
    <div class="flex"><h2 class="font-display tracking-widest text-neon" data-i18n="helpTitle"></h2><button onclick="closeModal('helpModal')" class="ml-auto text-xl text-slate-400">✕</button></div>
    <div id="helpBody" class="space-y-2"></div>
  </div>
</div>

<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-lg bg-slate-900 border border-neon text-sm"></div>

<script>
// ===================================================================
// Übersetzungen
// ===================================================================
const I18N = {
de: {
  doctor:'Deck Doctor', tierlist:'TIER-LISTE', searchArch:'Archetyp suchen…',
  tierNote:'Meta-Anteil = Anteil an Top-/Turnier-Decks im Zeitfenster. Tier-Badge nur, wenn MDM es liefert.',

  sharedDeck:'Geteiltes Deck', sharedHint:'Werte für genau diese Liste berechnet.', buildOwn:'Eigene Meta-Version bauen',

  optLog:'OPTIMIERER-PROTOKOLL', footer:'Daten: masterduelmeta.com (Top-Decks) & YGOPRODeck API (Kartentexte, Bilder lokal gecacht). Inoffizielles Fan-Tool, nicht mit Konami verbunden.',

  edHow1:'„Als Entwurf speichern“ zeigt den Guide sofort – aber nur in diesem Browser.',

const ROLE_COLORS = { starter:'#22d3ee', extender:'#34d399', handtrap:'#a855f7', breaker:'#f43f5e', engine:'#94a3b8', draw:'#f5c542', tech:'#fb923c', extra:'#64748b' };
const S = { lang:'de', status:null, tiers:[], deck:null, overrides:{}, charts:{}, draws:{S:0,A:0,B:0,Brick:0}, tr:{}, pb:null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try { return localStorage.getItem(k) } catch { return null } }, set(k,v){ try { localStorage.setItem(k,v) } catch {} }, del(k){ try { localStorage.removeItem(k) } catch {} } };

function t(key, vars={}) { let s = I18N[S.lang][key] ?? I18N.de[key] ?? key; if (typeof s === 'string') for (const [k,v] of Object.entries(vars)) s = s.replaceAll('{'+k+'}', v); return s; }
const pct = x => S.lang === 'en' ? (x*100).toFixed(1) + '%' : (x*100).toFixed(1).replace('.', ',') + ' %';
const roleName = r => t('roles')[r] || r;

// Lokalisierte Kartennamen/-texte (Englisch bleibt intern für Export & Kombo-Analyse)
const lname = c => (S.lang !== 'en' && S.tr[S.lang]?.[c.id]?.name) || c.name;
const ldesc = c => (S.lang !== 'en' && S.tr[S.lang]?.[c.id]?.desc) || c.desc;
function nameByEn(en) { const c = allCards().find(x => x.name === en); return c ? lname(c) : en; }
function allCards() { return [...(S.deck?.main||[]), ...(S.deck?.extra||[]), ...(S.doctorDeck?.main||[]), ...(S.doctorDeck?.extra||[])]; }

async function api(path, opts={}) {
  const r = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts });
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m } catch {} ; throw new Error(typeof m === 'string' ? m : JSON.stringify(m)); }
  return r.json();
}
function toast(msg, ms=2600) { const el=$('toast'); el.textContent=msg; el.classList.remove('hidden'); clearTimeout(el._h); el._h=setTimeout(()=>el.classList.add('hidden'), ms); }
function openModal(id){ $(id).classList.remove('hidden') } function closeModal(id){ $(id).classList.add('hidden') }
document.addEventListener('keydown', e => { if (e.key==='Escape') ['playbookModal','doctorModal','helpModal','editorModal','shareModal'].forEach(closeModal) });

async function loadTranslations(cards) {
  if (S.lang === 'en') return;
  const cache = S.tr[S.lang] ||= {};
  const ids = [...new Set(cards.map(c => c.id).filter(id => id && !(id in cache)))];
  for (let i = 0; i < ids.length; i += 200) {
    try { const res = await api('/api/i18n', { method:'POST', body: JSON.stringify({ lang:S.lang, ids: ids.slice(i, i+200) }) });
      ids.slice(i, i+200).forEach(id => cache[id] = res[id] || null); } catch {}
  }
}

function applyStatic() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  $('helpBody').innerHTML = t('help').map(p => `<p>${p}</p>`).join('');
  $('edHowto').innerHTML = ['edHow1','edHow2','edHow3'].map(k => `<li>${esc(t(k))}</li>`).join('');
  $('langDe').classList.toggle('lang-on', S.lang==='de'); $('langEn').classList.toggle('lang-on', S.lang==='en');
  $('drawLabel').textContent = t('drawN', {n: $('handSize').value});
}
async function setLang(lang) {
  S.lang = lang; store.set('lang', lang); applyStatic(); renderStatus(); renderTierlist();
  if (S.deck) { await loadTranslations(S.deck.main.concat(S.deck.extra)); renderDeck(); renderAnalysis(S.deck.analysis); renderChanges(); }
  if (!$('playbookModal').classList.contains('hidden')) openPlaybook();
}

async function loadStatus() { try { S.status = await api('/api/status'); } catch { S.status = { down:true }; } renderStatus(); }
function renderStatus() {
  const st = S.status, dot = $('statusDot'), txt = $('statusText');
  if (!st) { txt.textContent = t('statusLoading'); return; }
  if (st.down) { dot.className='w-2 h-2 rounded-full bg-rose-500'; txt.textContent = t('statusDown'); return; }
  const loc = S.lang === 'en' ? 'en-GB' : 'de-DE';
  if (st.refreshing) { dot.className='w-2 h-2 rounded-full bg-amber-400 pulse-dot'; txt.textContent = t('statusRefreshing'); }
  else if (st.ok && st.last_update) {
    const time = new Date(st.last_update).toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'});
    dot.className='w-2 h-2 rounded-full bg-emerald-400 pulse-dot';
    txt.innerHTML = t('statusLive', {t: time});
    $('statusBadge').title = `${new Date(st.last_update).toLocaleDateString(loc)} · ${st.decks} Decks · ${st.archetypes} · ${t('nextUpdate')}: ${st.next_run ? new Date(st.next_run).toLocaleString(loc) : '–'}`;
    $('sampleInfo').textContent = t('sample', {d: st.decks, w: st.window_days});
  } else { dot.className='w-2 h-2 rounded-full bg-rose-500'; txt.textContent = t('statusNone'); $('statusBadge').title = (st.errors||[]).join('\n'); }
  $('doctorAi').disabled = !st.ai_enabled; $('doctorAi').parentElement.title = st.ai_enabled ? '' : t('aiOff');
}
async function loadTierlist() {
  S.tiers = await api('/api/tierlist').catch(() => []);
  const sel = $('archSelect'), cur = sel.value;
  sel.innerHTML = S.tiers.map(x => `<option>${esc(x.archetype)}</option>`).join('');
  if (cur) sel.value = cur;
  renderTierlist();
}
function renderTierlist() {
  const q = $('tierSearch').value.toLowerCase(), max = Math.max(...S.tiers.map(x=>x.share), .01);
  $('tierlist').innerHTML = S.tiers.filter(x => x.archetype.toLowerCase().includes(q)).map(x => `
    <li><button onclick="pickArch(this.dataset.a)" data-a="${esc(x.archetype)}" class="w-full text-left px-3 py-2 rounded-lg hover:bg-cyan-500/10 border border-transparent hover:border-neon/40 transition">
      <div class="flex items-center gap-2 text-sm">
        ${x.tier!=null ? `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${x.tier==1?'bg-amber-400 text-black':x.tier==2?'bg-slate-300 text-black':'bg-slate-700'}">T${esc(x.tier)}</span>` : ''}
        <span class="truncate">${esc(x.archetype)}</span><span class="ml-auto text-xs text-slate-400">${pct(x.share)}</span></div>
      <div class="mt-1 h-1 rounded bg-slate-800"><div class="h-1 rounded bg-gradient-to-r from-cyan-400 to-violet" style="width:${x.share/max*100}%"></div></div>
    </button></li>`).join('') || `<li class="text-xs text-slate-500">${esc(t('noData'))}</li>`;

function pickArch(a) {
  $('archSelect').value = a; S.overrides = {};
  if (location.pathname.startsWith('/d/')) history.pushState({}, '', '/');
  buildDeck();
}

async function buildDeck() {
  const arch = $('archSelect').value; if (!arch) return toast(t('noArch'));
  const body = { archetype: arch, target: +$('target').value/100, hand_size: +$('handSize').value, overrides: S.overrides, lang: S.lang,
    max_ur_cp: $('maxUR').value === '' ? null : +$('maxUR').value, max_sr_cp: $('maxSR').value === '' ? null : +$('maxSR').value };
  let deck;
  try { toast(t('building'), 1200); deck = await api('/api/build', { method:'POST', body: JSON.stringify(body) }); }
  catch(e) { return toast(t('error') + e.message, 5000); }
  if (location.pathname.startsWith('/d/')) history.pushState({}, '', '/');
  await showDeck(deck);
}
async function showDeck(deck) {
  S.deck = deck; S.pb = null;
  await loadTranslations(deck.main.concat(deck.extra));
  S.draws = {S:0,A:0,B:0,Brick:0}; $('hand').innerHTML=''; $('handTier').textContent=''; $('drawStats').textContent='';
  $('emptyState').classList.add('hidden'); $('deckArea').classList.remove('hidden');
  $('sharedBanner').classList.toggle('hidden', !deck.shared); $('changesBox').classList.toggle('hidden', !!deck.shared);
  renderDeck(); renderAnalysis(deck.analysis); renderChanges();
}

function cardTile(c, opts={}) {
  const img = c.id ? `<img loading="lazy" src="/img/${c.id}.jpg" alt="${esc(lname(c))}" class="w-full aspect-[59/86] object-cover rounded-md">`
                   : `<div class="w-full aspect-[59/86] rounded-md bg-slate-800 grid place-items-center p-1 text-[9px] text-center">${esc(lname(c))}</div>`;
  const col = ROLE_COLORS[c.role] || ROLE_COLORS.tech;
  return `<div class="card-tile relative rounded-md r-${esc(c.rarity)} ${opts.anim?'draw-in':''} cursor-pointer" ${opts.style||''}
      data-name="${esc(c.name)}" onmouseenter="showTip(event,this)" onmousemove="moveTip(event)" onmouseleave="hideTip()" ${opts.click?`onclick="roleMenu(event,this.dataset.name)"`:''}>
    ${img}
    ${c.count>1 && !opts.hideCount ? `<span class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-void border border-neon text-[11px] font-bold grid place-items-center">${c.count}</span>`:''}
    <span class="absolute top-1 left-1 text-[9px] font-extrabold px-1 rounded badge-${esc(c.rarity)}">${esc(c.rarity)}</span>
    <span class="absolute bottom-0 inset-x-0 text-[9px] text-center font-semibold rounded-b-md py-0.5" style="background:${col}cc;color:#030712">${esc(roleName(c.role))}</span>
  </div>`;
}
function findCard(name) { return allCards().find(c => c.name === name); }

function renderDeck() {
  const d = S.deck;
  $('mainDeck').innerHTML = d.main.map(c => cardTile(c, {click:true})).join('');
  $('extraDeck').innerHTML = d.extra.map(c => cardTile(c)).join('') || `<span class="text-xs text-slate-500">${esc(t('noExtra'))}</span>`;
  $('mainCount').textContent = `(${d.main.reduce((a,c)=>a+c.count,0)})`; $('extraCount').textContent = `(${d.extra.reduce((a,c)=>a+c.count,0)})`;

function evaluateHand(cards) {
  const n = r => cards.filter(c => c.role === r).length, s=n('starter'), e=n('extender'), h=n('handtrap'), b=n('breaker');
  const combo = s >= 1 || e >= 2;
  if (combo && s+e >= 2 && h+b >= 1) return ['S', t('handS'), 'text-amber-300'];
  if (combo) return ['A', s ? t('handA1') : t('handA2'), 'text-cyan-300'];
  if (h+b >= 2) return ['B', t('handB'), 'text-violet-300'];
  return ['Brick', t('handBrick'), 'text-rose-400'];
}
function drawHand() {
  const pool = S.deck.main.flatMap(c => Array(c.count).fill(c));
  for (let i = pool.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i+1); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const hand = pool.slice(0, +$('handSize').value);
  $('hand').innerHTML = hand.map((c,i) => `<div class="w-24 shrink-0">${cardTile(c,{anim:true, hideCount:true, style:`style="animation-delay:${i*70}ms"`})}</div>`).join('');
  const [tier, label, cls] = evaluateHand(hand); S.draws[tier]++;
  $('handTier').innerHTML = `<b class="${cls}">${esc(label)}</b>`;
  const tot = Object.values(S.draws).reduce((a,b)=>a+b,0);
  $('drawStats').textContent = t('yourDraws', {n:tot}) + ['S','A','B','Brick'].map(k=>`${k} ${Math.round(S.draws[k]/tot*100)} %`).join(' · ') + ' | ' + t('expBrick', {p:pct(S.deck.analysis.tiers.Brick)});
}

// ===================================================================
function b64url(bytes) { let s=''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function packCards(list) {
  const m = new Map(); list.forEach(c => { if (c.id) m.set(c.id, Math.min(3, (m.get(c.id)||0) + c.count)); });
  const ids = [...m.keys()].sort((a,b)=>a-b), buf = new Uint8Array(ids.length*5), dv = new DataView(buf.buffer);
  ids.forEach((id,i) => { dv.setUint32(i*5, id, true); dv.setUint8(i*5+4, m.get(id)); }); return b64url(buf);
}
function shareCode(arch, main, extra) { return `${b64url(new TextEncoder().encode(arch).slice(0,80))}.${packCards(main)}.${packCards(extra)}`; }

      <div class="glass rounded-xl p-3"><div class="text-xs text-slate-400">${esc(t('score'))}</div><div class="font-display text-3xl ${sc}">${r.score}</div></div>
      <div class="glass rounded-xl p-3"><div class="text-xs text-slate-400">${esc(t('detected'))}</div><div class="font-semibold">${esc(r.archetype)}</div><div class="text-[11px] text-slate-500">${esc(t('refLists', {n:r.sample_size}))}</div></div>
      <div class="glass rounded-xl p-3"><div class="text-xs text-slate-400">${esc(t('comboOdds'))}</div><div class="font-display text-2xl">${pct(r.analysis.p_combo)}</div></div>
      <div class="glass rounded-xl p-3"><div class="text-xs text-slate-400">${esc(t('brickRisk'))}</div><div class="font-display text-2xl text-rose-300">${pct(r.analysis.tiers.Brick)}</div></div>
    </div>
    ${r.warnings.length ? `<div class="text-xs text-amber-300">${r.warnings.map(esc).join('<br>')}</div>`:''}
    <ul class="space-y-1">${r.findings.map(f=>`<li class="${col[f.severity]}">${ico[f.severity]} ${esc(f.text)}</li>`).join('')}</ul>
    <div class="grid grid-cols-6 sm:grid-cols-10 gap-2">${r.deck.main.map(c=>cardTile(c)).join('')}</div>
    ${r.ai ? `<div class="glass rounded-xl p-3"><div class="font-display text-xs tracking-widest text-amber-300 mb-1">${esc(t('aiCoach'))}</div><div class="whitespace-pre-line text-slate-200">${esc(r.ai)}</div></div>` : ''}
    <div class="flex flex-wrap gap-2">
      <button onclick="pickArch(S.doctorResult.archetype);closeModal('doctorModal')" class="btn px-4 py-2 rounded-lg bg-cyan-500/20 border border-neon text-sm">${esc(t('compare', {a:r.archetype}))}</button>
      <button onclick="openShare({archetype:S.doctorResult.archetype, main:S.doctorDeck.main, extra:S.doctorDeck.extra, analysis:S.doctorResult.analysis})" class="btn px-4 py-2 rounded-lg bg-amber-400/20 border border-amber-400 text-sm">${esc(t('shareDoctor'))}</button>
    </div>`;
}

// ===================================================================
// Boot
// ===================================================================
(async function boot() {
  const urlLang = new URLSearchParams(location.search).get('lang');
  const valid = l => ['de','en'].includes(l) ? l : null;
  S.lang = valid(urlLang) || valid(store.get('lang')) || ((navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en');
  applyStatic(); renderStatus();
  $('handSize').addEventListener('change', () => $('drawLabel').textContent = t('drawN', {n: $('handSize').value}));
  await loadStatus(); await loadTierlist(); await loadSharedFromUrl();
  addEventListener('popstate', () => { if (!location.pathname.startsWith('/d/')) $('sharedBanner').classList.add('hidden'); });
  setInterval(async () => { const before = S.status?.last_update; await loadStatus(); if (S.status?.last_update !== before) loadTierlist(); }, 60_000);
  const fast = setInterval(async () => { if (S.tiers.length) return clearInterval(fast); await loadStatus(); await loadTierlist(); }, 5000);
})();
</script>
</body>
</html>
